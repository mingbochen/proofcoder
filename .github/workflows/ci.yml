name: Offline CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"
  NO_COLOR: "1"

jobs:
  offline-validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11.9"

    steps:
      # Full history is required for the read-only history secret scan.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest-known"
          enable-cache: false

      - name: Check lock file
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      # From this point onward, validation cannot resolve or download dependencies.
      - name: Check formatting
        run: uv run --offline ruff format --check .

      - name: Lint
        run: uv run --offline ruff check .

      - name: Run tests with coverage
        run: uv run --offline pytest --cov=proofcoder --cov-report=term-missing

      - name: Verify POSIX executable resolution
        if: runner.os == 'Linux'
        run: uv run --offline pytest tests/unit/test_search_text.py::test_posix_resolver_rejects_non_executable_regular_file -q

      - name: Run offline doctor
        run: uv run --offline proofcoder doctor --offline

      - name: Check compliance
        run: uv run --offline python scripts/compliance_check.py --format json

      - name: Scan repository secrets
        run: uv run --offline python scripts/secret_scan.py --format json
