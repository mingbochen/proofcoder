[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proofcoder"
version = "0.1.0"
description = "A lightweight local coding agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66,<3",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
proofcoder = "proofcoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofcoder"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["proofcoder"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

