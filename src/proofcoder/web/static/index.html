<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="proofcoder-token" content="__PROOFCODER_SESSION_TOKEN__" />
    <title>ProofCoder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__head">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
            <span class="brand__name">ProofCoder</span>
          </div>
          <button class="icon-button sidebar__close" id="sidebar-close" type="button"
                  data-i18n-title="closeSidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>

        <button class="new-run" id="new-run" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          <span data-i18n="newTask">新任务</span>
        </button>

        <section class="workspace">
          <p class="section-label" data-i18n="workspace">工作区</p>
          <button class="workspace__button" id="workspace-button" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            <span class="workspace__name" id="workspace-name">—</span>
            <svg class="workspace__chevron" viewBox="0 0 24 24" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <p class="workspace__path" id="workspace-path"></p>
        </section>

        <section class="session">
          <p class="section-label" data-i18n="session">会话</p>
          <div class="session__row">
            <select class="session__select" id="session-select"></select>
            <button class="text-button" id="session-new" type="button" data-i18n="sessionNew">
              新建
            </button>
          </div>
          <p class="session__note" id="session-note"></p>
        </section>

        <section class="history">
          <p class="section-label" data-i18n="history">运行历史</p>
          <div class="history__list" id="history-list"></div>
        </section>

        <div class="sidebar__foot">
          <div class="status-line" id="status-line">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text" data-i18n="checking">正在检查…</span>
          </div>
          <div class="sidebar__actions">
            <button class="text-button" id="doctor-button" type="button" data-i18n="runDoctor">
              自检
            </button>
            <button class="text-button" id="lang-button" type="button">EN</button>
            <button class="text-button" id="theme-button" type="button" data-i18n="theme">主题</button>
          </div>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-button topbar__menu" id="sidebar-open" type="button"
                  data-i18n-title="openSidebar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="topbar__title">
            <h1 id="thread-title" data-i18n="newTask">新任务</h1>
            <p id="thread-subtitle"></p>
          </div>
          <div class="topbar__right">
            <span class="pill pill--muted" id="model-pill"></span>
            <button class="icon-button" id="settings-button" type="button"
                    data-i18n-title="runSettings">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
              </svg>
            </button>
          </div>
        </header>

        <div class="thread" id="thread">
          <div class="welcome" id="welcome">
            <div class="welcome__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </div>
            <h2 data-i18n="welcomeTitle">今天想让 ProofCoder 做什么？</h2>
            <p data-i18n="welcomeBody">
              描述一个编程任务。ProofCoder 会在你选定的工作区里读取、修改文件并运行本地验证，
              完成状态只由真实执行结果决定。
            </p>
            <div class="suggestions" id="suggestions"></div>
          </div>
          <div class="messages" id="messages"></div>
        </div>

        <div class="composer">
          <div class="composer__inner">
            <div class="composer__banner" id="composer-banner" hidden></div>
            <div class="composer__box">
              <textarea id="task-input" rows="1" data-i18n-placeholder="composerPlaceholder"
                        placeholder="描述一个任务，例如：为 utils.py 补充单元测试并运行"></textarea>
              <div class="composer__actions">
                <button class="send-button" id="send-button" type="button"
                        data-i18n-title="startRun">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7" />
                  </svg>
                </button>
                <button class="stop-button" id="stop-button" type="button" hidden
                        data-i18n-title="stopRun">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="2" />
                  </svg>
                </button>
              </div>
            </div>
            <p class="composer__hint" data-i18n="composerHint">
              Enter 发送 · Shift + Enter 换行 · 运行前请选择一个可丢弃的工作区
            </p>
          </div>
        </div>
      </main>
    </div>

    <div class="modal" id="workspace-modal" hidden>
      <div class="modal__backdrop" data-close="workspace-modal"></div>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <div class="modal__head">
          <h2 data-i18n="chooseWorkspace">选择工作区</h2>
          <button class="icon-button" type="button" data-close="workspace-modal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="path-row">
            <input type="text" id="workspace-input" spellcheck="false"
                   data-i18n-placeholder="workspacePlaceholder" placeholder="输入或粘贴目录路径" />
            <button class="primary-button" id="workspace-apply" type="button" data-i18n="use">
              使用
            </button>
          </div>
          <p class="modal__note" id="workspace-feedback"></p>
          <div class="browser" id="browser">
            <div class="browser__bar">
              <button class="text-button" id="browser-up" type="button" data-i18n="parent">
                上级目录
              </button>
              <span class="browser__here" id="browser-here"></span>
            </div>
            <div class="browser__roots" id="browser-roots"></div>
            <div class="browser__list" id="browser-list"></div>
          </div>
          <div class="recent" id="recent-wrapper" hidden>
            <p class="section-label" data-i18n="recent">最近使用</p>
            <div class="recent__list" id="recent-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="settings-modal" hidden>
      <div class="modal__backdrop" data-close="settings-modal"></div>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <div class="modal__head">
          <h2 data-i18n="runSettings">运行设置</h2>
          <button class="icon-button" type="button" data-close="settings-modal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="modal__body">
          <p class="modal__note" data-i18n="settingsNote">
            这些上限与命令行参数一一对应，用于限制一次运行的成本和影响范围。
          </p>
          <div class="field-grid" id="limit-fields"></div>
          <div class="modal__foot">
            <button class="text-button" id="settings-reset" type="button" data-i18n="reset">
              恢复默认
            </button>
            <button class="primary-button" id="settings-save" type="button" data-i18n="save">
              保存
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="doctor-modal" hidden>
      <div class="modal__backdrop" data-close="doctor-modal"></div>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <div class="modal__head">
          <h2 data-i18n="doctorTitle">环境自检</h2>
          <button class="icon-button" type="button" data-close="doctor-modal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="check-list" id="doctor-results"></div>
          <div class="modal__foot">
            <button class="text-button" id="doctor-offline" type="button" data-i18n="offlineCheck">
              仅本地检查
            </button>
            <button class="primary-button" id="doctor-online" type="button" data-i18n="onlineCheck">
              连接检查
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" defer></script>
  </body>
</html>
